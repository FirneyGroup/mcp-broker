name: Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Do not cancel mid-scan on rapid pushes.
concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # PR tree is untrusted. Never leave result filenames the gate will trust.
      - name: Clear untrusted security result paths
        run: |
          set -euo pipefail
          rm -f findings.json claudecode-results.json claudecode-error.log
          rm -rf claudecode .claudecode-marker

      # Write scan instructions from THIS workflow file (must match main — Anthropic
      # gate) into RUNNER_TEMP. Never read docs/ from the untrusted PR checkout.
      - name: Write trusted security scan instructions
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/claude-security-scan-instructions.txt" <<'INSTRUCTIONS'
          Firney ADK security priorities (apply in addition to general SAST):

          1. Multi-tenant isolation
             - Every data query/filter that touches tenant data MUST scope by client_id
               (or equivalent app-scoped key). Missing client_id filters are HIGH.
             - Do not allow one tenant's auth context to read another tenant's sessions,
               recipes, tool configs, or artifacts.

          2. Recipe / app-config store
             - Unsigned recipe load must fail closed when signatures are required.
             - Platform-owned tool config fields (credentials, write_mode, project_id,
               maximum_bytes_billed, bare url/key/uri) must not be tenant-overridable.
             - Cold recipe version / cache keys must not collide distinct recipe bodies.

          3. Auth and API keys
             - Never log raw API keys, OAuth tokens, or JWTs.
             - Trusted-header and Firebase auth paths must not skip tenant binding.

          4. A2A / untrusted input
             - Request body size must be capped before buffering (streaming/chunked paths too).
             - MIME admission must not bypass required screening when screening is enabled.
             - Declared file parts that skip Model Armor are known residual risk (#112) —
               only flag NEW bypasses, not the documented trade-off.

          5. Workflow / CI (when reviewing workflow files)
             - Prefer scoped Bash(command:*) patterns over unrestricted Bash.
             - Do not trust PR-tree files as evidence that a security scan ran.
             - Minimize GITHUB_TOKEN permissions; avoid id-token: write unless OIDC is used.

          Ignore pure style, naming, and pre-existing issues outside the PR diff.
          INSTRUCTIONS
          # Strip the leading indent from the heredoc body for a clean file.
          sed -i 's/^          //' "${RUNNER_TEMP}/claude-security-scan-instructions.txt"

      # FirneyGroup fork with OAuth (upstream still lacks oauth input as of pin).
      # Sync: gh repo sync FirneyGroup/claude-code-security-review
      # Pin: 657c445 (fork main, OAuth support). Re-pin after sync.
      - name: Claude Code Security Review
        id: security
        uses: FirneyGroup/claude-code-security-review@657c44557a3ef75ddbc3e684e3f455e5d87773b0
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude-model: claude-opus-5
          run-every-commit: true
          # We post summary + inlines ourselves so later commits can still comment
          # (upstream script skips ALL inlines if any prior Security Issue exists).
          comment-pr: false
          upload-results: true
          exclude-directories: data,logs,.venv,node_modules,dist,build
          custom-security-scan-instructions: ${{ runner.temp }}/claude-security-scan-instructions.txt

      # Move results out of the PR tree immediately so later steps never read
      # attacker-controlled paths from the checkout root.
      - name: Stage scan results outside checkout
        id: stage
        if: always()
        env:
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/security-review-results"
          mkdir -p "$DEST"
          staged=0
          for f in findings.json claudecode-results.json claudecode-error.log; do
            if [ -f "$f" ]; then
              cp "$f" "$DEST/$f"
              staged=1
            fi
          done
          if [ -f claudecode/claudecode-results.json ] && [ ! -f "$DEST/claudecode-results.json" ]; then
            cp claudecode/claudecode-results.json "$DEST/claudecode-results.json"
            staged=1
          fi
          rm -f findings.json claudecode-results.json claudecode-error.log
          rm -rf claudecode
          echo "results_dir=$DEST" >> "$GITHUB_OUTPUT"
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          echo "security_outcome=$SECURITY_OUTCOME" >> "$GITHUB_OUTPUT"
          ls -la "$DEST" || true

      - name: Post security review summary and inlines
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS_DIR: ${{ steps.stage.outputs.results_dir }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FINDINGS=0
          STATUS="no results (scan may have failed or been skipped)"
          RESULTS_JSON="[]"

          # Guard every jq call so set -e never aborts before the summary posts.
          if [ -f "${RESULTS_DIR}/findings.json" ]; then
            FINDINGS=$(jq 'if type == "array" then length else 0 end' "${RESULTS_DIR}/findings.json" 2>/dev/null || echo "0")
            RESULTS_JSON=$(jq '.' "${RESULTS_DIR}/findings.json" 2>/dev/null || echo "[]")
            STATUS="completed (security step: ${SECURITY_OUTCOME})"
          elif [ -f "${RESULTS_DIR}/claudecode-results.json" ]; then
            FINDINGS=$(jq -r '.findings | if . == null then 0 else length end' "${RESULTS_DIR}/claudecode-results.json" 2>/dev/null || echo "0")
            RESULTS_JSON=$(jq '.findings // []' "${RESULTS_DIR}/claudecode-results.json" 2>/dev/null || echo "[]")
            STATUS="completed (security step: ${SECURITY_OUTCOME})"
            if jq -e '.error' "${RESULTS_DIR}/claudecode-results.json" >/dev/null 2>&1; then
              ERR=$(jq -r '.error // "unknown"' "${RESULTS_DIR}/claudecode-results.json" 2>/dev/null || echo "unknown")
              STATUS="error: ${ERR}"
            fi
          fi

          # Normalize non-numeric FINDINGS so later arithmetic is safe.
          if ! [[ "${FINDINGS}" =~ ^[0-9]+$ ]]; then
            FINDINGS=0
          fi

          BODY=$(cat <<MD
          ## Security Review — full scan

          - **PR:** #${PR}
          - **Head:** \`${SHA}\`
          - **Model:** \`claude-opus-5\`
          - **Security step:** ${SECURITY_OUTCOME}
          - **Status:** ${STATUS}
          - **Findings:** ${FINDINGS}
          - **Job:** ${RUN_URL}

          Inline comments are re-posted for findings not already present on this head.
          MD
          )
          BODY=$(printf '%s\n' "$BODY" | sed 's/^          //')
          gh pr comment "$PR" --body "$BODY"
          echo "Posted security summary (findings=${FINDINGS})"

          if [ "${FINDINGS}" -gt 0 ]; then
            EXISTING=$(gh api "repos/${REPO}/pulls/${PR}/comments" --paginate \
              --jq '[.[] | select(.body | test("Security Issue";"i")) | "\(.path):\(.line // .original_line // 0)"] | unique | .[]' || true)
            echo "${RESULTS_JSON}" | jq -c '.[]?' 2>/dev/null | while read -r row; do
              [ -n "${row}" ] || continue
              path=$(echo "$row" | jq -r '.file // .path // empty' 2>/dev/null || true)
              line=$(echo "$row" | jq -r '.line // (.start.line // 1)' 2>/dev/null || echo "1")
              desc=$(echo "$row" | jq -r '.description // .extra.message // "Security vulnerability detected"' 2>/dev/null || echo "Security vulnerability detected")
              sev=$(echo "$row" | jq -r '.severity // "HIGH"' 2>/dev/null || echo "HIGH")
              catg=$(echo "$row" | jq -r '.category // "security_issue"' 2>/dev/null || echo "security_issue")
              rec=$(echo "$row" | jq -r '.recommendation // .extra.metadata.recommendation // empty' 2>/dev/null || true)
              key="${path}:${line}"
              if printf '%s\n' "$EXISTING" | grep -Fxq "$key"; then
                echo "Skip existing inline $key"
                continue
              fi
              body=$(printf '🤖 **Security Issue: %s**\n\n**Severity:** %s\n**Category:** %s\n**Tool:** ClaudeCode AI Security Analysis\n' "$desc" "$sev" "$catg")
              if [ -n "$rec" ] && [ "$rec" != "null" ]; then
                body=$(printf '%s\n**Recommendation:** %s\n' "$body" "$rec")
              fi
              if gh api "repos/${REPO}/pulls/${PR}/comments" \
                -f body="$body" -f path="$path" -F line="$line" -f side=RIGHT -f commit_id="$SHA" 2>/dev/null; then
                echo "Posted inline $key"
              else
                echo "Could not post inline $key (line may be outside diff)"
              fi
            done || true
          fi

      - name: Verify security scan produced results
        if: github.event_name == 'pull_request'
        env:
          RESULTS_DIR: ${{ steps.stage.outputs.results_dir }}
          SECURITY_OUTCOME: ${{ steps.security.outcome }}
        run: |
          set -euo pipefail
          if [ "${SECURITY_OUTCOME}" != "success" ]; then
            echo "::error::Security action step outcome was '${SECURITY_OUTCOME}', not success."
            exit 1
          fi
          if [ -f "${RESULTS_DIR}/findings.json" ]; then
            n=$(jq 'if type == "array" then length else 0 end' "${RESULTS_DIR}/findings.json" 2>/dev/null || echo "0")
            echo "OK: staged findings.json (${n} findings) under RUNNER_TEMP"
            exit 0
          fi
          if [ -f "${RESULTS_DIR}/claudecode-results.json" ]; then
            echo "OK: staged claudecode-results.json under RUNNER_TEMP"
            if jq -e '.error' "${RESULTS_DIR}/claudecode-results.json" >/dev/null 2>&1; then
              echo "::error::Security scan reported an error: $(jq -r '.error' "${RESULTS_DIR}/claudecode-results.json" 2>/dev/null || echo unknown)"
              exit 1
            fi
            exit 0
          fi
          echo "::error::No staged results under RUNNER_TEMP after security step. Scan skipped or failed silently."
          exit 1
